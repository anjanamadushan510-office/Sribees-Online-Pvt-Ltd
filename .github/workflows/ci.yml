name: CI Pipeline

on:
  workflow_dispatch:

# Cancel in-progress runs for the same PR branch to conserve CI resources,
# but guarantee runs on the main branch complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn Modern)
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type Check (TypeScript)
        id: typecheck
        run: yarn typecheck

      - name: Run Unit Tests
        id: test
        run: yarn test

      - name: Run Linter (ESLint)
        id: lint
        run: yarn lint
        # Note: continue-on-error is set to true so pre-existing codebase lint warnings
        # do not block CI until the team addresses them. Remove once codebase is clean.
        continue-on-error: true

      - name: Quality Check Summary
        if: always()
        run: |
          echo "### 🔍 Code Quality & Test Status" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Typecheck | ${{ steps.typecheck.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.test.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ${{ steps.lint.outcome }} |" >> $GITHUB_STEP_SUMMARY

  build:
    name: Production Build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.sribees.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn Modern)
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-

      - name: Build Application (Next.js)
        run: yarn build

      - name: Build Summary
        if: success()
        run: |
          echo "### 🚀 Production Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
